name: Bug report
description: Create a report to help us improve.
title: "[BUG]: "
labels: 
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please check below before post your issue.
        * For questions, use [GitHub Discussions](https://github.com/FireDragonGameStudio/com.unity.webrtc.fdgs/discussions).
        * Before you file an issue read the [Contributing guide](https://github.com/FireDragonGameStudio/com.unity.webrtc.fdgs/blob/main/CONTRIBUTING.md).
        * Check to make sure someone hasn't already opened a similar [issue](https://github.com/FireDragonGameStudio/com.unity.webrtc.fdgs/issues).
         
        Please note the following points.
        * This project is maintained by volunteers, so replies may take a while.
        * If you solved the issue yourself, please **post the comment and close your issue**.
        * We may close the issue if we do not receive a reply for more than **4 weeks**.

  - type: dropdown
    id: version
    attributes:
      label: Package version
      description: |
        What version of the package are you using?
        You can check the package version in the Package Manager window. See [manual](https://docs.unity3d.com/Manual/upm-ui.html).
      options:
        - 3.0.0
        - main (unreleased)
        - Others
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please describe your environment when the issue occurred.
        Example:
          - **OS**: Windows10
          - **Unity version**: Unity 6000.0.40f1
          - **Graphics API**: Direct3D11
      value: |
          * OS:
          * Unity version:
          * Graphics API:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run '...'
        4. See error...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
    validations:
      required: false
      
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: |
        Links? Reference? Anything that will give us more context about the issue you are encountering!
        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
      placeholder: |
        Drag and drop image or text files here.
    validations:
      required: false